; Dev OPcache for the PHP CLI server.
;
; `php artisan serve` runs under the cli-server SAPI, which is gated by
; opcache.enable_cli (OFF by default). Without this, every request recompiles all
; of Laravel from the bind-mounted source on each hit — multi-second responses on
; Windows/macOS (the app looks empty because requests crawl). Enabling it drops
; warm requests from ~4s to ~0.1s. validate_timestamps keeps edits live (revalidated
; at most every 60s), so backend code changes are still picked up in dev.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
